<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صح ولا غلط - بار كريف</title>

  <style>
    body { font-family: Tahoma, Arial, sans-serif; background: #1f3d2b; margin: 0;
           display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .box { background: #fff; width: 90%; max-width: 480px; padding: 24px;
           border-radius: 16px; text-align: center; color: #222; margin: 16px 0; }
    .hidden { display: none; }
    button { font-size: 18px; padding: 12px 24px; border: none; border-radius: 10px;
             cursor: pointer; margin: 6px; color: #fff; background: #6b4a2f; }
    .true-btn { background: #2e8b57; }
    .false-btn { background: #c0392b; }
    .stats { display: flex; justify-content: space-around; margin-bottom: 16px; font-weight: bold; }
    #qtext { font-size: 22px; margin: 24px 0; line-height: 1.6; }
    #feedback { min-height: 60px; font-size: 16px; line-height: 1.6; }
    .ok { color: #2e8b57; } .bad { color: #c0392b; }
    input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px;
            margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
    .note { font-size: 13px; color: #666; margin-top: 10px; }
    #error { color: #c0392b; min-height: 22px; font-size: 14px; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
@keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes floatUp { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-90px) scale(1.6); } }
.slide { animation: slideIn .35s ease; }
.good-flash { animation: pulse .4s; outline: 4px solid #2e8b57; }
.bad-flash { animation: shake .4s; outline: 4px solid #c0392b; }
#game { position: relative; overflow: hidden; }
#pop { position: absolute; top: 35%; left: 0; right: 0; font-size: 42px; font-weight: bold;
       color: #2e8b57; pointer-events: none; opacity: 0; }
.pop-go { animation: floatUp .9s ease-out; }
  </style>
</head>

<body>

  <!-- شاشة البداية -->
  <div id="start" class="box">
    <h1>صح ولا غلط</h1>
    <p>اختبر معلوماتك في مانوال بار كريف</p>
    <input id="f-name" type="text" placeholder="الاسم">
    <input id="f-code" type="text" placeholder="الكود">
    <input id="f-job" type="text" placeholder="الوظيفة">
    <input id="f-branch" type="text" placeholder="الفرع">
    <div id="error"></div>
    <button onclick="startGame()">ابدأ</button>
    <div class="note">نتيجتك بتتسجل عشان المتابعة والتقييم.</div>
  </div>

  <!-- شاشة اللعبة -->
  <div id="game" class="box hidden">
    <div id="pop"></div>
    <div class="stats">
      <span>النقاط: <span id="score">0</span></span>
      <span>السلسلة: <span id="streak">0</span></span>
    </div>
    <div id="progress"></div>
    <div id="qtext"></div>
    <button class="true-btn" onclick="answer(true)">صح ✔</button>
    <button class="false-btn" onclick="answer(false)">غلط ✖</button>
    <div id="feedback"></div>
    <button id="next" class="hidden" onclick="nextQuestion()">التالي</button>
  </div>

  <!-- شاشة النتيجة -->
  <div id="result" class="box hidden">
    <h2>النتيجة النهائية</h2>
    <p>النقاط: <b id="r-score"></b></p>
    <p>الدقة: <b id="r-acc"></b></p>
    <p>أعلى سلسلة صح: <b id="r-streak"></b></p>
    <p id="r-status" class="note"></p>
    <button onclick="playAgain()">العب تاني</button>
  </div>

  <script src="questions.js"></script>
  <script>
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbx-AAm5TSPDnfL4ln1G-iuMeKOlAO_ENHv4N-GPh_fj43e0UIypeBoWlwMkopD2o_nq/exec";

    let questions = [], index = 0, score = 0, streak = 0, bestStreak = 0, correctCount = 0, locked = false;
    let player = {};
    const $ = id => document.getElementById(id);

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

    function show(id) {
      ['start', 'game', 'result'].forEach(s => $(s).classList.add('hidden'));
      $(id).classList.remove('hidden');
    }

    function startGame() {
      player = {
        name: $('f-name').value.trim(),
        code: $('f-code').value.trim(),
        job: $('f-job').value.trim(),
        branch: $('f-branch').value.trim()
      };
      if (!player.name || !player.code || !player.job || !player.branch) {
        $('error').textContent = 'من فضلك املأ كل البيانات قبل ما تبدأ';
        return;
      }
      $('error').textContent = '';
      questions = shuffle(QUESTIONS);
      index = 0; score = 0; streak = 0; bestStreak = 0; correctCount = 0;
      show('game');
      showQuestion();
    }

    function playAgain() {
      ['f-name', 'f-code', 'f-job', 'f-branch'].forEach(id => $(id).value = '');
      show('start');
    }

    function showQuestion() {
      locked = false;
      $('qtext').textContent = questions[index].text;
      $('progress').textContent = 'سؤال ' + (index + 1) + ' من ' + questions.length;
      $('score').textContent = score;
      $('streak').textContent = streak;
      $('feedback').textContent = '';
      $('next').classList.add('hidden');
    }

    function answer(choice) {
      if (locked) return;
      locked = true;
      const q = questions[index];
      if (choice === q.answer) {
        correctCount++; streak++; score += 10;
        bestStreak = Math.max(bestStreak, streak);
        $('feedback').innerHTML = '<span class="ok">✔ إجابة صح!</span><br>' + q.note;
      } else {
        streak = 0;
        $('feedback').innerHTML = '<span class="bad">✖ إجابة غلط</span><br>' + q.note;
      }
      $('score').textContent = score;
      $('streak').textContent = streak;
      $('next').textContent = (index === questions.length - 1) ? 'شوف النتيجة' : 'التالي';
      $('next').classList.remove('hidden');
    }

    function nextQuestion() {
      index++;
      if (index >= questions.length) showResult(); else showQuestion();
    }

    function showResult() {
      const accuracy = Math.round(correctCount / questions.length * 100) + '%';
      $('r-score').textContent = score;
      $('r-acc').textContent = accuracy;
      $('r-streak').textContent = bestStreak;
      $('r-status').textContent = 'جاري تسجيل نتيجتك...';
      show('result');

      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          name: player.name, code: player.code, job: player.job,
          branch: player.branch, score: score, accuracy: accuracy
        })
      })
      .then(() => { $('r-status').textContent = '✔ تم تسجيل نتيجتك'; })
      .catch(() => { $('r-status').textContent = 'تعذّر تسجيل النتيجة، تأكد من الإنترنت وجرّب تاني'; });
    }
  </script>
</body>
</html>
